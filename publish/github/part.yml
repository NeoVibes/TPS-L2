name: New or corrected part
description: A part that is missing, wrong, or matched to the wrong service-manual entry
title: "[Part] "
labels: ["part"]
body:
  - type: markdown
    attributes:
      value: |
        A maintainer reviews every report; nothing changes the model by itself.
        **This issue is public.** Hide serial numbers and leave out your name and address. Remove location data from photographs. A page you link to is public too and may show your account name.
  - type: input
    id: part
    attributes:
      label: Part ID, or the service manual's Ref. No. or Part No.
      description: The model's ID (for example CTL-05) if the part exists in the model; otherwise Sony's number.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of report
      options:
        - The part is missing from the model
        - The part's shape or position is wrong
        - The lettering of an exterior version is wrong
        - The part is matched to the wrong service-manual entry
        - The part should not be there
    validations:
      required: true
  - type: dropdown
    id: exterior
    attributes:
      label: Exterior version of your player
      description: Go by the lettering, not the serial number.
      options:
        - "Later: SONY and WALKMAN on the door"
        - "Intermediate: STEREO on the door, sockets marked A B"
        - "Early: STEREO on the door, sockets marked GUYS & DOLLS"
        - Not sure, or no player (reference material only)
    validations:
      required: true
  - type: dropdown
    id: variant
    attributes:
      label: Cassette
      description: Only for cassette parts (MEDIA-…).
      options:
        - Not a cassette part
        - Original cassette
        - Detailed cassette
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is missing or wrong
    validations:
      required: true
  - type: textarea
    id: right
    attributes:
      label: What it should be
      description: Name the features that matter (sizes, positions, how it moves) and give values where you have them.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How you know
      description: Service-manual page, photos or links to photos, or the part in hand and how you measured it.
    validations:
      required: true
  - type: input
    id: edited_copy
    attributes:
      label: Link to your edited copy (optional)
      description: If you have already made the change in Blender, put your copy anywhere you like and paste the link. Blender saves folder names from your computer in the file; the kit's release guide has a one-line step that removes them.
  - type: input
    id: serial
    attributes:
      label: Serial number, in part
      description: Only its first two digits and how many digits it has, for example "13, six digits". Never the whole number.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: No whole serial number, name, address or other personal detail is visible in the text, the photographs or the linked pages.
          required: true
        - label: Location data has been removed from the photographs.
          required: true
