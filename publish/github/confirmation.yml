name: Confirmation
description: One feature of one part, checked against a real player or reference material
title: "[Confirmation] "
labels: ["confirmation"]
body:
  - type: markdown
    attributes:
      value: |
        One issue per feature. A maintainer reviews it and adjusts the model; the part's level rises only when the model matches.
        **This issue is public.** Hide serial numbers and leave out your name and address. Remove location data from photographs. A page you link to is public too and may show your account name.
  - type: input
    id: part
    attributes:
      label: Part ID
      description: From the viewer's Inspect panel or view/master-parts.csv, for example BAY-052.
    validations:
      required: true
  - type: dropdown
    id: exterior
    attributes:
      label: Exterior version of your player
      description: Go by the lettering, not the serial number.
      options:
        - "Later: SONY and WALKMAN on the door"
        - "Intermediate: STEREO on the door, sockets marked A B"
        - "Early: STEREO on the door, sockets marked GUYS & DOLLS"
        - Not sure, or no player (reference material only)
    validations:
      required: true
  - type: dropdown
    id: variant
    attributes:
      label: Cassette
      description: Only for cassette parts (MEDIA-…). The model has two cassettes and they are assessed separately.
      options:
        - Not a cassette part
        - Original cassette
        - Detailed cassette
    validations:
      required: true
  - type: input
    id: feature
    attributes:
      label: Feature
      description: One measurable thing, such as a diameter, a thickness, a shaft position or a travel.
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: Where the measurement starts and ends
      description: Exact enough that someone else would measure the same thing. Say which direction it lies in.
    validations:
      required: true
  - type: input
    id: value
    attributes:
      label: Value, units and uncertainty
      placeholder: 2.00 mm ± 0.02
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Method
      description: The instrument and its resolution, or the reference document, or the photograph and what gives it its scale.
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Requested level
      options:
        - Not sure
        - "2: based on reference material (standards, manufacturer specifications, photos, service manuals)"
        - "3: estimated from photographs using a defined measuring reference"
        - "4: measured from a physical part"
        - "5: measured from a physical part, with supporting evidence"
        - "6: this corroborates an earlier level 5 measurement, made by someone else on another player"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Photos or links to photos
      description: Attach them or paste links; either is enough. Your own photo of the measurement supports "measured from a physical part". A link to someone else's photo counts as reference material. For level 6, give the number of the issue you are corroborating.
  - type: input
    id: edited_copy
    attributes:
      label: Link to your edited copy (optional)
      description: If you have already adjusted the part in Blender, put your copy anywhere you like and paste the link. Blender saves folder names from your computer in the file; the kit's release guide has a one-line step that removes them.
  - type: input
    id: serial
    attributes:
      label: Serial number, in part
      description: Only its first two digits and how many digits it has, for example "13, six digits". Never the whole number.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: No whole serial number, name, address or other personal detail is visible in the text, the photographs or the linked pages.
          required: true
        - label: Location data has been removed from the photographs.
          required: true
